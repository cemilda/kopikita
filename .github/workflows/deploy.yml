# Deploy aset menu dengan OIDC (Lab L4.3, zero-trust): tanpa access key AWS statis.
# GitHub menerbitkan token OIDC berumur pendek; AWS menukarnya dengan kredensial sementara
# HANYA bila klaim token cocok dengan trust policy role (repo + branch main).
name: Deploy aset menu

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # hanya job ini yang boleh meminta token OIDC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-3
      - run: aws s3 sync web/public s3://kopikita-menu-assets-lab --delete
