# Gerbang IaC: gagalkan PR bila ada salah konfigurasi high (Lab L3.4).
name: IaC scan

on:
  pull_request:
    paths: ["infra/**", ".github/workflows/iac-scan.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkov:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: bridgecrewio/checkov-action@c10e2438743528f9e4549758fad8b7a62052541d # v12.3136.0
        with:
          directory: infra/
          framework: terraform,kubernetes
          # Checkov open source tidak membawa label severity tanpa API key platform Prisma Cloud.
          # Karena itu tim menuliskan sendiri daftar temuan "high" yang wajib menggagalkan PR:
          #   CKV_AWS_20 bucket S3 ACL public-read     CKV_AWS_24 SSH 0.0.0.0/0
          #   CKV_AWS_3  EBS tidak terenkripsi         CKV_K8S_16 kontainer privileged
          # Temuan lain tetap dilaporkan (soft fail) dan masuk tab Security lewat SARIF.
          soft_fail: true
          hard_fail_on: CKV_AWS_20,CKV_AWS_24,CKV_AWS_3,CKV_K8S_16
          output_format: cli,sarif
          output_file_path: console,checkov.sarif
      - if: always()
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: checkov.sarif
          category: checkov
