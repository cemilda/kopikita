# Review keamanan Claude pada setiap PR (Lab L2.4).
# Action ini BELUM diperkuat terhadap prompt injection: pakai hanya untuk PR tepercaya.
# Di repo publik, GitHub menahan secret pada PR dari fork, jadi langkah ini aman dilewati di sana.
name: Security Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  security-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - uses: anthropics/claude-code-security-review@0c6a49f1fa56a1d472575da86a94dbc1edb78eda # main
        with:
          comment-pr: true
          claude-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
