# Workflow CI yang sudah dikeraskan (Lab L3.2):
# izin minimal per job, action dipin ke commit SHA, secret tidak diekspos ke job yang tidak memakainya.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - run: pip install -r api/requirements.txt -r requirements-dev.txt
      - run: pytest -q
      - run: npm --prefix web test
