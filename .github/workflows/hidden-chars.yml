# Gerbang CI: tolak PR yang menyisipkan karakter bidi atau zero-width (Lab L4.3).
name: Hidden chars

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      # Pindai SELURUH repo, termasuk CLAUDE.md, .claude/, .mcp.json, dan .github/
      # (berkas aturan agen adalah target utama "rules file backdoor").
      - run: python scripts/check_hidden_chars.py .
