# Rule kustom hanya boleh masuk CI bila punya test yang lulus.
name: Semgrep (rule kustom)

on:
  push:
    branches: [main, "lab/**"]
  pull_request:

permissions:
  contents: read

jobs:
  semgrep:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - run: pip install semgrep==1.182.0
      - name: Test rule (wajib lulus)
        run: semgrep --test rules/
      - name: Pindai api/ dengan rule tim
        run: semgrep scan --config rules/ --sarif --output semgrep.sarif api/
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: semgrep.sarif
          category: semgrep-kopikita
